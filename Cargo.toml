[package]
name = "openshell-hyperlight"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A policy-explicit JSON CLI for running Python in Hyperlight on Linux/KVM"
repository = "https://github.com/simongdavies/openshell-hyperlight"
keywords = ["openshell", "hyperlight", "sandbox", "python", "kvm"]
categories = ["command-line-utilities", "virtualization"]

[features]
default = []
hyperlight = [
    "dep:hyperlight-sandbox",
    "dep:hyperlight-wasm-sandbox",
]

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
url = "2.5.7"
wait-timeout = "0.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
hyperlight-sandbox = { version = "=0.7.0", path = "vendor/hyperlight-sandbox-src/src/hyperlight_sandbox", optional = true }
hyperlight-wasm-sandbox = { version = "=0.7.0", path = "vendor/hyperlight-sandbox-src/src/wasm_sandbox", optional = true }

[dev-dependencies]
anyhow = "1.0.100"
assert_cmd = "2.0.17"
pretty_assertions = "1.4.1"
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
